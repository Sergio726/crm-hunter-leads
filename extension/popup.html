<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Hunter Leads</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        background: #070908;
        color: #f2fff9;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .marca {
        font: 700 10px/1 Consolas, "SF Mono", Menlo, monospace;
        letter-spacing: 0.14em;
        color: #02ffc4;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9fb3aa;
        margin: 10px 0 4px;
        font-family: Consolas, "SF Mono", Menlo, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #2a332d;
        background: #10130f;
        color: #f2fff9;
        font: 12px/1.3 Consolas, "SF Mono", Menlo, monospace;
      }
      input:focus {
        outline: 2px solid rgba(2, 255, 196, 0.6);
        outline-offset: 1px;
        border-color: #02ffc4;
      }
      .fila {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        min-height: 34px;
        border-radius: 8px;
        border: 1px solid #2a332d;
        background: #10130f;
        color: #f2fff9;
        font: 600 12px/1 inherit;
        cursor: pointer;
      }
      button.primario {
        background: #02ffc4;
        border-color: #02ffc4;
        color: #070908;
      }
      #estado {
        margin: 10px 0 0;
        font-size: 12px;
        min-height: 1.4em;
        color: #9fb3aa;
      }
      #estado.ok {
        color: #02ffc4;
      }
      #estado.error {
        color: #ff8a80;
      }
      .ayuda {
        margin: 12px 0 0;
        font-size: 11px;
        color: #6f8078;
      }
      .ayuda a {
        color: #9fb3aa;
      }
    </style>
  </head>
  <body>
    <div class="marca">HUNTER LEADS</div>

    <label for="baseUrl">Dirección del CRM</label>
    <input id="baseUrl" type="url" placeholder="https://crm-hunter-leads.vercel.app" spellcheck="false" />

    <label for="token">Token de la extensión</label>
    <input id="token" type="password" placeholder="hl_ext_…" spellcheck="false" autocomplete="off" />

    <div class="fila">
      <button id="guardar" class="primario">Guardar y probar</button>
    </div>

    <p id="estado"></p>

    <p class="ayuda">
      El token se genera en el CRM, en <strong>Mi perfil → Extensión de Chrome</strong>. Se
      muestra una sola vez.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
